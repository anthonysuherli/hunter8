  - 'Jefferies OR Evercore OR Lazard OR Moelis OR "Houlihan Lokey" OR "Perella Weinberg" ("AI engineer" OR "machine learning" OR "generative AI" OR agentic) ("New York" OR NYC) job 2026'
  - 'MSCI OR "S&P Global" OR "Moody''s" OR FactSet OR Morningstar ("AI engineer" OR "knowledge graph" OR "LLM" OR agentic OR "GenAI") ("New York" OR remote US) hiring 2026'
