# Watchlist for AI / agentic-systems / research engineer roles (NYC-heavy).
# Tuned to Anthony's edge: production agentic AI × evaluation × regulated
# enterprise deployment — with institutional finance as domain depth, not the
# only axis. `ats` ∈ greenhouse|ashby|lever.
#
# Slugs verified live: finance + VC blocks 2026-07-16; everything below the
# "expansion" marker 2026-07-28 (probed against the live ATS APIs, only slugs
# returning >0 postings were kept).
#
# Confirmed NOT on any public Greenhouse/Ashby/Lever board as of 2026-07-28 —
# every plausible slug variant 404s, so these are reachable only via
# tavily_queries: Citadel, Citadel Securities, Two Sigma, D.E. Shaw,
# Balyasny, Bridgewater, Susquehanna/SIG, Verition, Quantlab, PEAK6,
# Walleye, Coatue, Arrowstreet, Numerai, Hamilton Lane, Geode, Bloomberg,
# BlackRock, Goldman, JPM, Evercore, Cboe,
# CME, MSCI, Moody's, FactSet, Morningstar.
#
# Re-probed 2026-08-01 against every ATS (not just the three JSON boards), by
# sniffing each careers page for its real host. Still tavily-only, with the
# reason now known: BlackRock, PIMCO, T. Rowe Price, Franklin Templeton, KKR,
# Brookfield, BNY, Moody's, FactSet, Cboe, CME, Morningstar, Wells Fargo,
# Goldman, JPMorgan, Fidelity (careers pages expose no machine-readable ATS);
# MSCI and ICE/NYSE (iCIMS — no adapter); Bank of America also runs Avature
# alongside the Workday board added below; American Express and Citi expose
# eightfold boards that 403 the API, so Citi is reached via Workday instead;
# Jefferies' Workday CXS endpoint returns 422 on every site-name variant;
# Neuberger Berman is on Workable (no adapter) — note this was the single
# best-fit NYC opening in the 2026-07-26 sweep, so it needs manual checking
# or a Workable adapter.
# NOTE: tavily hits carry no posted_at, so any run using --since-days skips
# them entirely. Run the screen without a date window to reach these.

