[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "hunter8-companion-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "delapan[cloud]",
  # delapan.api.auth transitively imports delapan.store.sqlite, which
  # unconditionally requires sqlite-vec at module load even though this
  # package only uses the Supabase/cloud path.
  "sqlite-vec>=0.1.6",
  "fastapi>=0.122.0",
  "uvicorn[standard]>=0.38.0",
  "pydantic-settings>=2.12.0",
  "pydantic[email]>=2.12.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.2", "httpx>=0.28.1"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
